services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commuteng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commuteng_prod}
      POSTGRES_DB: commute_ng
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commuteng -d commute_ng"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./commute-ng-backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./commute-ng-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./commute-ng-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
